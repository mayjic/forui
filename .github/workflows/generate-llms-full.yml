name: Generate llms-full.txt

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docs dependencies
        working-directory: docs
        run: npm install

      - name: Run generator (tsx)
        working-directory: docs
        run: npx tsx generate-llms-full.ts

      - name: Upload llms-full.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: llms-full
          path: docs/llms-full.txt
